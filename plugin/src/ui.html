<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paster</title>
    <!-- STYLE -->
  </head>
  <body>
    <h1>Paster</h1>
    <p id="status">Scanning selection&hellip;</p>
    <div id="layouts"></div>
    <ul id="errors"></ul>
    <ul id="warnings" aria-label="Skipped layers"></ul>
    <fieldset id="export-mode">
      <legend>Export</legend>
      <label class="row">
        <input type="radio" name="mode" value="json" checked />
        Geometry JSON only
      </label>
      <label class="row">
        <input type="radio" name="mode" value="zip" />
        ZIP with images
      </label>
      <label class="row" id="format-row" hidden>
        Raster image format
        <select id="format">
          <option value="PNG">PNG</option>
          <option value="JPG">JPG</option>
        </select>
      </label>
      <p class="hint" id="format-hint" hidden>
        Vector shapes always export as SVG, and anything that might need
        transparency uses PNG regardless of this setting — this only applies
        to confirmed-opaque photos.
      </p>
    </fieldset>
    <button id="refresh" type="button">Refresh selection</button>
    <button id="export" type="button" disabled>Export JSON</button>
    <textarea
      id="output"
      readonly
      placeholder="Exported JSON will appear here — copy it from this box."
    ></textarea>
    <!-- SCRIPT -->
  </body>
</html>
