<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paster</title>
    <!-- STYLE -->
  </head>
  <body>
    <h1>Paster</h1>
    <p id="status">Scanning selection&hellip;</p>
    <ul id="errors"></ul>
    <ul id="warnings" aria-label="Skipped layers"></ul>
    <div class="actions">
      <button id="refresh" type="button">Refresh</button>
      <button id="copy-json" type="button" disabled>
        <span class="label">Copy JSON</span>
        <span class="label label-active">Copied</span>
      </button>
      <button id="export-zip" type="button" disabled>
        <span class="label">Export ZIP</span>
        <span class="label label-active">Exporting images&hellip;</span>
      </button>
    </div>
    <div id="output"></div>
    <!-- SCRIPT -->
  </body>
</html>
